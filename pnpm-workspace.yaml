packages:
    - "."

allowBuilds:
    "@parcel/watcher": true
    esbuild: true
    pre-commit: true
    spawn-sync: true
    unrs-resolver: true

minimumReleaseAgeExclude:
    - "@codemirror/view@6.44.0"
    - "@types/node@26.6.10"

onlyBuiltDependencies:
    - "."

overrides:
    glob@>=9.0.0 <=14.0.1: ^14.0.2
    minimatch@>=7.0.0 <11.0.1: ^11.0.1
